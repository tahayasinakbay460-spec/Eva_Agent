services:
  - type: web
    name: eva
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:///eva_users.db
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_FALLBACK_ORDER
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: SAMBANOVA_MODEL
        sync: false
      - key: CHROMA_DB_PATH
        value: ./chroma_db
      - key: ANONYMIZED_TELEMETRY
        value: "False"
