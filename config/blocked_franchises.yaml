# Telifli karakter ve markalar (CLAUDE.md §9.1, §12 "Telif"). Kullanıcının oluşturduğu bir
# karakterin ADI bunlardan birini içerirse karakter oluşturulamaz. (Kimlik metnine bakılmaz:
# "Harry Potter hayranı bir genç" gibi masum açıklamalar engellenmesin.) Gerçek insan adı da
# olabilen tek kelimeler (Elsa, Mario...) yerine tam karakter adı yazılır.
# Eşleşme büyük/küçük harf ve Türkçe karakter duyarsız, tam kelime ya da kelime grubu olarak
# yapılır (ör. "batman" eşleşir, "batmanlı" eşleşmez). Liste hukukçu görüşüyle genişletilir.
# Kamu malı kurgusal karakterler (Sherlock Holmes, Keloğlan, Nasreddin Hoca, Dracula...) burada
# YOK; onlar serbest.

