# Ses ve yüz kataloğu. Kullanıcı EVA'yı buradaki herhangi bir sesle ve herhangi bir yüzle
# kullanabilir (ses ve yüz birbirinden bağımsız seçilir). Ayrıca kendi onaylı klon sesini ve
# kendi fotoğrafını seçebilir; onlar burada değil, rızalı kayıttan gelir ("own").
#
# Her seçenek: name (ekranda görünen ad) + sağlayıcı adı -> o sağlayıcıdaki id. Gizli bilgi
# değildir. Bir seçenek yalnızca providers.yaml'da seçili sağlayıcıda id'si varsa listelenir
# (boş bırakılan görünmez). Anahtarlar küçük harf: a-z, 0-9, - ve _ ("own" ayrılmış).
#
# Hazır sesler: ElevenLabs'in ücretsiz planda da API'den kullanılabilen hazır (premade) sesleri
# (GET /v2/voices?voice_type=default, 2026-10-17). Kütüphane sesleri ücretli planda eklenebilir.
# Yüzler: LemonSlice için lemonslice.com'da oluşturulan avatarın id'si, herkese açık bir görselin
# https adresi ya da bu klasöre göre yerel bir görsel: "file:media/<ad>.png" (2x3 dikey, yüz ve
# omuzlar kadrajı doldursun). config/media/ git'e girmez (görsellerin lisansı bize ait olmalı).
# Diğer sağlayıcılar: LiveAvatar GET /v1/avatars/public · Anam Lab > Avatars.

# Personaların varsayılanı. Sahibin kararı: EVA'nın sesi EVA'ya özgü (özgün ses tasarlanana kadar
# ElevenLabs'in hazır sesi Jessica; genç yetişkin, sıcak bir kadın sesi).
