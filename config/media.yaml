# Sistem personalarının (şimdilik sadece EVA) sesi ve yüzü: sağlayıcı adı -> o sağlayıcıdaki id.
# Gizli bilgi değildir. Sağlayıcı providers.yaml'da değişince burada karşılığı olmalı.
#
# Sahibin kararı (2026-10-16): EVA'nın özgün sesi/yüzü sonra tasarlanacak; o zamana kadar
# sağlayıcının hazır (stok) bir sesi ve avatarı kullanılır. Ses: genç yetişkin, sıcak bir
# kadın sesi. Boş olanlar anahtar gelince seçilecek:
#   ElevenLabs:  GET /v1/voices  (Türkçe'yi iyi okuyan, sıcak bir kadın sesi)
#   LiveAvatar:  GET /v1/avatars/public
#   Anam:        Anam Lab > Avatars (ya da GET https://api.anam.ai/v1/avatars)
#   LemonSlice:  lemonslice.com > oluşturulan avatarın (agent) id'si
eva:
  voice:
    mock: eva-mock
    elevenlabs: "cgSgspJ2msm6clMCkdW9"   # Jessica (hazır ses; ücretsiz planda kütüphane sesleri API'de yok)
  avatar:
    mock: eva-mock
    liveavatar: ""
    anam: "edf6fdcb-acab-44b8-b974-ded72665ee26"   # Mia (studio)
    # LemonSlice: lemonslice.com'da oluşturulan avatarın id'si, herkese açık bir görselin https
    # adresi ya da bu klasöre göre yerel bir görsel: "file:media/eva.png" (2x3 dikey, yüz ve
    # omuzlar kadrajı doldursun). config/media/ git'e girmez (görselin lisansı bize ait olmalı).
    lemonslice: ""
