# Provider selection per feature. Swapping a provider is a config change, not a code change.
# Model IDs live ONLY here (CLAUDE.md §4.3). Secrets never live here.
#
# `provider` must be a registered adapter name (see backend/app/providers/registry.py).
# EVA_LLM_PROVIDER_OVERRIDE=mock forces every llm.* feature to the mock adapter.

llm:
  chat:                      # text chat over SSE
    provider: anthropic
    model: claude-sonnet-5-5
    max_tokens: 1024
    effort: low              # chat is latency-sensitive; raise after evals
  realtime:                  # voice / video agent turns
    provider: anthropic
    model: claude-haiku-5-5
    max_tokens: 400
    effort: low
  background:                # memory merge, persona synthesis (worker)
    provider: anthropic
    model: claude-sonnet-5-5
    max_tokens: 4096
    effort: high

# Interfaces below have no real adapter yet (CLAUDE.md §15); mock keeps tests green.
stt:
  realtime: { provider: mock }
tts:
  realtime: { provider: mock }
  preview: { provider: mock }
avatar:
  realtime: { provider: mock }
embedding:
  memory: { provider: mock }
moderation:
  default: { provider: mock }
messaging:
  default: { provider: mock }
