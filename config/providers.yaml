# Her özellik için hangi sağlayıcının kullanılacağı burada seçilir. Sağlayıcı değiştirmek
# kod değişikliği değil, bu dosyada ayar değişikliğidir.
# Model ID'leri YALNIZCA burada durur (CLAUDE.md §4.3). Gizli anahtarlar asla buraya yazılmaz.
#
# `provider`, kayıtlı bir adaptörün adı olmalı (bkz. backend/app/providers/registry.py).
# EVA_LLM_PROVIDER_OVERRIDE=mock verilirse tüm llm.* özellikleri sahte (mock) adaptörü kullanır.

# LLM sağlayıcısı OpenAI (sahibin kararı, ADR 0004). Modeller başlangıç tahminidir; kesin
# seçim eval + gecikme ölçümüyle yapılır. max_tokens akıl yürütme token'larını da kapsar.
llm:
  chat:                      # SSE ile akan metin sohbeti
    provider: openai
    model: gpt-6-luna
    max_tokens: 1024
    effort: low              # sohbette hız önemli; eval sonuçlarına göre artırılabilir
  realtime:                  # sesli / görüntülü görüşmede ajanın cevapları
    provider: openai
    model: gpt-6-luna
    max_tokens: 400
    effort: none             # sesli görüşmede her milisaniye önemli
  background:                # anıları birleştirme, persona oluşturma (arka plan işçisi)
    provider: openai
    model: gpt-6.1-sol
    max_tokens: 4096
    effort: medium

# Ses. Gerçek adaptörler yazıldı ama anahtar gelene kadar mock seçili. Anahtar gelince:
#   stt.realtime  -> { provider: openai, model: gpt-live-transcribe }     (OPENAI_API_KEY)
#   tts.*         -> { provider: elevenlabs, model_id: eleven_flash_v2_5 } (ELEVENLABS_API_KEY)
#   voice_enrollment.default -> { provider: elevenlabs }
# STT'nin kesin seçimi Türkçe doğruluk + gecikme testiyle yapılacak (§15).
stt:
  realtime: { provider: mock }
tts:
  realtime: { provider: mock }
  preview: { provider: mock }
voice_enrollment:
  default: { provider: mock }
# Avatar (görüntülü görüşme). Anahtar gelince:
#   avatar.realtime -> { provider: liveavatar, video_quality: high }   (LIVEAVATAR_API_KEY)
#   Denemek için ücretsiz "sandbox": sandbox: true (yalnızca "Wayne" avatarı, ~1 dk).
# avatar_enrollment'ın gerçek adaptörü YOK: LiveAvatar'da özel avatar oluşturma API'si yok
# (2026-10-16, ADR 0006). Gerçek ortamda mock olduğu için yüz kaydı kapalı kalır.
avatar:
  realtime: { provider: mock }
avatar_enrollment:
  default: { provider: mock }
embedding:
  memory: { provider: mock }
moderation:
  default: { provider: mock }
messaging:
  default: { provider: dev_mailbox }   # §15'te sağlayıcı seçilene kadar e-postaları backend/dev_mailbox/ klasörüne yazar
