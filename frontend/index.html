<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Eva — Dürüst, empatik yapay zeka dostun" />
  <title>Eva AI</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/auth.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Marked.js: Markdown → HTML dönüşümü için (Eva markdown yazabilir) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <!-- ── ARKA PLAN EFEKT TOPLARI ────────────────────────────────── -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <!-- ── ANA UYGULAMA KAPSAYICISI ──────────────────────────────── -->
  <div class="app">

    <!-- ── HEADER ──────────────────────────────────────────────── -->
    <header class="header">
      <div class="header-left">
        <!-- Eva Avatarı -->
        <div class="avatar" id="eva-avatar">
          <div class="avatar-ring"></div>
          <span class="avatar-emoji">🤖</span>
          <!-- Düşünürken çıkan küçük noktalar -->
          <div class="avatar-thinking" id="avatar-thinking">
            <span></span><span></span><span></span>
          </div>
        </div>
        <!-- İsim ve Durum -->
        <div class="header-info">
          <h1 class="header-title">Eva</h1>
          <span class="header-status" id="status-text">● Çevrimiçi</span>
        </div>
      </div>

      <div class="header-right">
        <!-- Kullanıcı adı rozeti -->
        <div class="user-badge" id="user-badge" title="Giriş yapılan hesap">
          👤 <span id="header-username">...</span>
        </div>
        <!-- Hafıza rozeti -->
        <div class="memory-badge" title="Uzun süreli hafıza aktif">
          🧠 Hafıza
        </div>
        <!-- Sohbeti temizle butonu -->
        <button class="btn-clear" id="btn-clear" title="Sohbeti temizle">
          🗑️ Temizle
        </button>
        <!-- Çıkış butonu -->
        <button class="btn-logout" id="btn-logout" title="Çıkış yap">
          🚪 Çıkış
        </button>
      </div>
    </header>

    <!-- ── SOHBET ALANI ─────────────────────────────────────────── -->
    <main class="chat-window" id="chat-window">
      <!-- Mesajlar JavaScript tarafından buraya eklenir -->
    </main>

    <!-- ── GİRİŞ ALANI ─────────────────────────────────────────── -->
    <footer class="input-area">
      <div class="input-wrapper">
        <textarea id="user-input" class="input-textarea"
          placeholder="Eva'ya bir şey yaz... (Enter gönder, Shift+Enter yeni satır)" rows="1"></textarea>
        <button id="btn-send" class="btn-send" disabled>
          <!-- Gönder ikonu (SVG) -->
          <svg id="icon-send" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <!-- Yükleniyor ikonu (gizli) -->
          <svg id="icon-loading" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            style="display:none">
            <path d="M21 12a9 9 0 11-6.219-8.56" />
          </svg>
        </button>
      </div>
      <p class="input-hint">Eva dürüsttür — her zaman hemfikir olmayabilir.</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/static/script.js"></script>
</body>

</html>
