<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Eva — Dürüst, empatik yapay zeka dostun" />
  <title>Eva AI</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Marked.js: Markdown → HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <!-- ── ARKA PLAN EFEKT TOPLARI ──────────────────────────────── -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <!-- ── ANA LAYOUT (Sidebar + Chat) ─────────────────────────── -->
  <div class="layout">

    <!-- ════════════════════════════════════════════════════════
         SOL PANEL (Sidebar)
         ════════════════════════════════════════════════════════ -->
    <aside class="sidebar" id="sidebar">

      <!-- Sidebar Header -->
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <span class="sidebar-brand-icon">🤖</span>
          <span class="sidebar-brand-name">Eva</span>
        </div>
        <!-- Yeni Sohbet Butonu -->
        <button class="btn-new-chat" id="btn-new-chat" title="Yeni Sohbet">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Yeni
        </button>
      </div>

      <!-- Kullanıcı rozeti -->
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">👤</div>
        <div class="sidebar-user-info">
          <span class="sidebar-username" id="sidebar-username">...</span>
          <span class="sidebar-user-status">● Çevrimiçi</span>
        </div>
        <button class="btn-sidebar-logout" id="btn-logout" title="Çıkış Yap">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- Sohbet Listesi -->
      <div class="sidebar-section-label">Geçmiş Sohbetler</div>
      <nav class="conversation-list" id="conversation-list">
        <!-- JavaScript tarafından doldurulur -->
        <div class="conv-loading" id="conv-loading">
          <div class="conv-loading-dot"></div>
          <div class="conv-loading-dot"></div>
          <div class="conv-loading-dot"></div>
        </div>
      </nav>

    </aside>

    <!-- Sidebar Overlay (mobilde kapamak için) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ════════════════════════════════════════════════════════
         SAĞ TARAF (Ana Sohbet)
         ════════════════════════════════════════════════════════ -->
    <div class="chat-area">

      <!-- ── HEADER ──────────────────────────────────────────── -->
      <header class="header">
        <div class="header-left">
          <!-- Hamburger (mobil) -->
          <button class="btn-hamburger" id="btn-hamburger" title="Menüyü Aç/Kapat">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <!-- Eva Avatarı -->
          <div class="avatar" id="eva-avatar">
            <div class="avatar-ring"></div>
            <span class="avatar-emoji">🤖</span>
            <div class="avatar-thinking" id="avatar-thinking">
              <span></span><span></span><span></span>
            </div>
          </div>
          <!-- İsim ve Durum -->
          <div class="header-info">
            <h1 class="header-title">Eva</h1>
            <span class="header-status" id="status-text">● Çevrimiçi</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Kamera Modu Toggle (Faz 5) -->
          <button class="btn-camera-toggle" id="btn-camera-toggle" title="Kamera modunu aç/kapat">📷 Kamera</button>
          <!-- Ses Toggle -->
          <button class="btn-tts-toggle" id="btn-tts-toggle" title="Eva'nın sesini aç/kapat">🔊 Ses</button>
          <!-- Hafıza rozeti -->
          <div class="memory-badge" title="Uzun süreli hafıza aktif">🧠 Hafıza</div>
          <!-- Sohbeti temizle -->
          <button class="btn-clear" id="btn-clear" title="Sohbeti temizle">🗑️ Temizle</button>
        </div>
      </header>

      <!-- ── SOHBET ALANI ────────────────────────────────────── -->
      <main class="chat-window" id="chat-window">
        <!-- Mesajlar JavaScript tarafından buraya eklenir -->
      </main>

      <!-- ── GİRİŞ ALANI ──────────────────────────────────────── -->
      <footer class="input-area">
        <div class="input-wrapper">
          <textarea id="user-input" class="input-textarea"
            placeholder="Eva'ya bir şey yaz... (Enter gönder, Shift+Enter yeni satır)" rows="1"></textarea>

          <!-- Mikrofon Butonu (STT) -->
          <button id="btn-mic" class="btn-mic" title="Sesle yaz">
            <svg id="icon-mic" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>

          <!-- Gönder Butonu -->
          <button id="btn-send" class="btn-send" disabled>
            <svg id="icon-send" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            <svg id="icon-loading" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              style="display:none">
              <path d="M21 12a9 9 0 11-6.219-8.56" />
            </svg>
          </button>
        </div>
        <p class="input-hint">Eva dürüsttür — her zaman hemfikir olmayabilir.</p>
      </footer>

    </div><!-- /chat-area -->
  </div><!-- /layout -->

  <!-- Kamera Stream — gizli, sadece frame yakalama için (Faz 5) -->
  <video id="camera-video" autoplay playsinline style="display:none;"></video>
  <canvas id="camera-canvas" style="display:none;"></canvas>

  <script src="/static/script.js"></script>
</body>

</html>
