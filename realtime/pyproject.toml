[project]
name = "eva-realtime"
version = "0.1.0"
description = "EVA sesli/goruntulu gorusme ajani (LiveKit Agents)"
requires-python = ">=3.12"
dependencies = [
    "eva-backend",
    "livekit-agents[silero]~=1.8.8",
]

[tool.uv.sources]
eva-backend = { path = "../backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eva_realtime"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF"]
ignore = ["S101"]
allowed-confusables = ["ı", "İ", "ş", "Ş", "ğ", "Ğ", "ç", "Ç", "ö", "Ö", "ü", "Ü", "«", "»"]

[tool.ruff.lint.isort]
known-first-party = ["eva_realtime", "app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
